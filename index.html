<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador Interactivo - Ordo Magnus</title>
    <meta name="description" content="Analiza tus partidas de ajedrez con sabiduría táctica y humor caribeño. Stockfish local gratis para siempre.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-icon">O</div>
            <h1>Analizador Interactivo - Ordo Magnus</h1>
        </div>
        <div class="header-actions" style="display: flex; align-items: center; gap: 1rem;">
            <span id="engine-status" style="font-size: 0.8rem; color: var(--text-muted); min-width: 100px;">Motor: Listo</span>
        </div>
    </header>

    <main>
        <section class="game-container">
            <div class="board-layout-container" style="display: flex; gap: 1.5rem; align-items: center; justify-content: center; position: relative; margin: auto; max-height: 100%; padding: 1rem 0;">
                <div class="evaluation-bar-wrapper" style="display: flex; align-items: center; position: relative; height: 100%;">
                    <div id="eval-value" style="position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 0.75rem; font-weight: bold; color: var(--accent-gold); width: 40px; text-align: center;">0.0</div>
                    <div class="evaluation-bar">
                        <div id="eval-fill" class="eval-fill" style="height: 50%;"></div>
                    </div>
                </div>
                
                <div class="board-wrapper" style="position: relative; border-radius: 8px; overflow: hidden;">
                    <div id="chessboard"></div>
                    <div id="hint-container" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(3px);">
                        <div style="background: var(--secondary-bg); border: 2px solid var(--accent-purple); padding: 1.5rem; border-radius: 8px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8);">
                            <h3 id="hint-msg" style="color: white; margin-bottom: 1rem; font-size: 1.1rem;">¿Ver sugerencia del módulo?</h3>
                            <div style="display: flex; gap: 1rem; justify-content: center;">
                                <button id="btn-hint-yes" class="primary" style="background: var(--success); padding: 0.5rem 1.5rem; font-size: 0.9rem; border-radius: 6px;">Sí</button>
                                <button id="btn-hint-no" class="primary" style="background: var(--danger); padding: 0.5rem 1.5rem; font-size: 0.9rem; border-radius: 6px;">Continuar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <aside class="analysis-sidebar">
            <div id="game-selector-container" style="display: none; background: var(--primary-bg); padding: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <label for="game-select" style="font-size: 0.7rem; color: var(--text-muted); white-space: nowrap;">Partida:</label>
                    <select id="game-select" style="flex: 1; background: var(--secondary-bg); color: white; border: 1px solid var(--accent-gold); border-radius: 4px; padding: 2px 4px; font-size: 0.75rem;"></select>
                </div>
            </div>

            <div class="whisperer-card">
                <div class="perspective-selector" style="margin-bottom: 0.5rem; display: flex; gap: 0.5rem; align-items: center; justify-content: center;">
                    <button id="perspective-white" class="trainer-btn active">⚪ Blancas</button>
                    <button id="perspective-black" class="trainer-btn">⚫ Negras</button>
                </div>
                <div class="whisperer-header">
                    <div class="avatar-container" style="width: 100px; height: 100px; position: relative; background: transparent; border: none;">
                        <img id="whisperer-avatar" src="robot_avatar.png" alt="Ordo Magnus" style="border-radius: 50%; box-shadow: 0 0 20px rgba(0, 210, 255, 0.4); width: 100%; height: 100%; object-fit: cover;">
                        <div class="voice-waves">
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                            <div class="wave-bar"></div>
                        </div>
                    </div>
                    <div class="whisperer-info">
                        <h2 id="trainer-name" style="font-size: 0.9rem;">Ordo Magnus</h2>
                    </div>
                </div>
                <div class="speech-bubble" style="padding: 0.5rem; font-size: 0.8rem;">
                    <p id="whisperer-text">¡Listo para analizar!</p>
                </div>
            </div>

            <div class="game-controls" style="flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; padding: 0.4rem 0.75rem;">
                <div class="board-controls" style="margin-bottom: 0.5rem; display: flex; gap: 0.3rem; align-items: center; justify-content: center;">
                    <button id="btn-first" title="Inicio" style="padding: 0.25rem 0.4rem; font-size: 0.7rem;">|&lt;</button>
                    <button id="btn-prev" title="Anterior" style="padding: 0.25rem 0.4rem; font-size: 0.7rem;">&lt;</button>
                    <button id="btn-autoplay" class="primary" title="Auto" style="padding: 0.25rem 0.6rem; font-size: 0.7rem;">▶ Auto</button>
                    <button id="btn-next" title="Siguiente" style="padding: 0.25rem 0.4rem; font-size: 0.7rem;">&gt;</button>
                    <button id="btn-last" title="Final" style="padding: 0.25rem 0.4rem; font-size: 0.7rem;">&gt;|</button>
                    <button id="btn-flip" title="Girar" style="padding: 0.25rem 0.4rem; font-size: 0.7rem;">🔄</button>
                </div>

                <div class="moves-container" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
                    <h3 style="margin-bottom: 0.25rem; font-size: 0.8rem; color: var(--accent-gold);">Lista de Jugadas</h3>
                    <div id="moves-list" class="moves-list" style="flex: 1; overflow-y: auto;">
                        <!-- Moves will be injected here -->
                    </div>
                </div>

                <div id="accuracy-report" class="accuracy-container" style="display: none; margin-top: 0.5rem; background: rgba(0,0,0,0.2); padding: 0.5rem; border-radius: 6px;">
                    <div style="display: flex; justify-content: space-around; font-size: 0.8rem; font-weight: bold;">
                        <div id="acc-white" style="background: white; color: black; padding: 0.3rem 0.8rem; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);">⬜ --%</div>
                        <div id="acc-black" style="background: #2a2a2a; color: white; padding: 0.3rem 0.8rem; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);">⬛ --%</div>
                    </div>
                </div>
            </div>

            <div class="pgn-input-area" style="flex-shrink: 0; background: rgba(255,255,255,0.02); padding: 0.5rem; border-top: 1px solid rgba(255,255,255,0.08);">
                <p style="font-size: 0.65rem; color: var(--text-muted); margin-bottom: 0.3rem;">📋 Pega tu PGN o escribe jugadas (termina con *)</p>
                <textarea id="pgn-input" placeholder="1. e4 e5 2. Nf3..."></textarea>
                <div style="margin-top: 0.4rem; display: flex; gap: 0.4rem;">
                    <button id="btn-nav-upload" class="trainer-btn" style="flex: 1;">📂 Cargar PGN</button>
                    <button id="btn-export-pgn" class="trainer-btn" style="flex: 1; background: var(--accent-gold); color: var(--primary-bg);">📥 Guardar PGN</button>
                    <input type="file" id="pgn-file" accept=".pgn" style="display: none;">
                </div>
            </div>
        </aside>
    </main>

    <div id="export-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 style="color: var(--accent-gold); margin-bottom: 0.5rem;">Registrar Partida</h3>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1.5rem;">Personaliza los datos de tu estudio antes de descargar.</p>
            
            <div class="modal-field">
                <label>Jugador Blancas</label>
                <input type="text" id="meta-white" placeholder="Anonimo">
            </div>
            
            <div class="modal-field">
                <label>Jugador Negras</label>
                <input type="text" id="meta-black" placeholder="Anonimo">
            </div>
            
            <div class="modal-field">
                <label>Resultado</label>
                <select id="meta-result">
                    <option value="*">* (En curso/Desconocido)</option>
                    <option value="1-0">1-0 (Ganan Blancas)</option>
                    <option value="0-1">0-1 (Ganan Negras)</option>
                    <option value="1/2-1/2">1/2-1/2 (Tablas)</option>
                </select>
            </div>
            
            <div class="modal-actions" style="margin-top: 2rem; display: flex; gap: 1rem;">
                <button id="modal-cancel" class="trainer-btn" style="flex: 1;">Cancelar</button>
                <button id="modal-save" class="trainer-btn primary" style="flex: 1; background: var(--accent-gold); color: var(--primary-bg);">Guardar y Descargar</button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
